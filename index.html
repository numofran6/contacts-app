<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!-- Responsive design meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts List</title>

    <!-- Load Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">

    <!-- Load main stylesheet -->
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="container">
      <!-- Page Title -->
      <header>Contacts</header>

      <!-- Search Input: triggers list reload on typing -->
      <input
        type="text"
        id="search-input"
        placeholder="Search contacts..."
        oninput="loadContactsList()"
      >

      <div class="header-actions">
        <!-- Show Only Favorites -->
        <label class="show-favorites">
          <input type="checkbox" id="show-favorites"> <span>Show Favorites Only</span>
        </label>

        <!-- Sorting Button -->
        <button id="sort-btn" class="sort-btn" onclick="toggleSortOrder()">
          ⬇ Sort: A–Z
        </button>
      </div>

      <!-- Container where contacts will be rendered dynamically -->
      <div id="contacts-list"></div>

      <!-- Message shown when no contacts exist -->
      <div id="empty-message">
        No contacts found!
      </div>

      <!-- Pagination buttons (generated dynamically) -->
      <div id="pagination" class="pagination"></div>

      <!-- Button to redirect user to the Add Contact form -->
      <button class="btn btn-primary" onclick="location.href='form.html'">
        Add New Contact
      </button>
    </div>

    <!-- Confirmation Modal Overlay (hidden by default) -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <!-- Message inside the modal (text updated dynamically) -->
        <p id="modal-message">Are you sure?</p>

        <!-- Modal action buttons -->
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-confirm" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- Load main script. -->
    <script src="main.js"></script>

    <!-- Initialize contact list on page load -->
    <script>
      loadContactsList();
    </script>
  </body>
</html>
