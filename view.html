<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container view-contact">
      <button class="btn btn-secondary" onclick="location.href='index.html'">
        <i class="icon-angle-double-left"></i> 
        <span>Back to Contacts</span>
      </button>
      <div id="contact-details"></div>
      <button id="edit-btn" class="btn btn-primary">Edit Contact</button>
    </div>

    <script src="main.js"></script>
    <script>
    const params = new URLSearchParams(location.search);
    const index = params.get('id');

    loadContactDetails(index);
    document.getElementById('edit-btn').onclick = () => {
      location.href = 'form.html?edit=' + index;
    };
  </script>
  </body>
</html>
