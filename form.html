<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <header id="form-title">Add Contact</header>
      <form id="contact-form">
        <div class="form-control">
          <label for="name">Full Name</label>
          <div class="input-container">
            <input type="text" id="name" name="full-name" required>
            <div class="asterik"><span>*</span></div>
            <span class="error-msg"></span>
          </div>
        </div>
        <div class="form-control">
          <label for="phone">Phone</label>
          <div class="input-container">
            <input type="text" id="phone" name="phone" required>
            <div class="asterik"><span>*</span></div>
            <span class="error-msg"></span>
          </div>
        </div>
        <div class="form-control">
          <label for="email">Email Address</label>
          <div class="input-container">
            <input type="email" id="email" name="email" required>
            <div class="asterik"><span>*</span></div>
            <span class="error-msg"></span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="icon-save"></i>
          <span>Save</span></button>
      </form>
      <div class="actions">
        <button type="button" class="btn text-btn"
          onclick="location.href='index.html'"><i class="icon-close"></i>
          <span>Cancel</span></button>
        <button type="button" id="delete-btn" class="btn btn-danger"
          style="display:none;"><i class="icon-trash"></i>
          <span>Delete</span></button>
      </div>
    </div>
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <p id="modal-message">Are you sure?</p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-confirm" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const editIndex = params.get('edit');
      setupForm(editIndex);
    </script>
  </body>
</html>
